name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build web app
        run: |
          cd web
          pnpm install
          pnpm build

      - name: Deploy to relaxandlearn.de
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -v relaxandlearn.de >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -v -o BatchMode=yes zipa-onnx-inference@relaxandlearn.de "echo SSH OK"
          rsync -av --delete -e "ssh -i ~/.ssh/deploy_key -v" \
            web/dist/ zipa-onnx-inference@relaxandlearn.de:public_html/
